<!DOCTYPE html>
<html>
<head>
  <title>SAR Text-to-Speech</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#0f172a;
      color:white;
    }

    .login-screen{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .card{
      background:#1e293b;
      padding:25px;
      border-radius:12px;
      width:320px;
      box-shadow:0 0 20px rgba(0,0,0,0.3);
    }

    h2{
      text-align:center;
    }

    input,
    textarea,
    select,
    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:8px;
      box-sizing:border-box;
      font-size:15px;
    }

    textarea{
      height:140px;
      resize:none;
    }

    button{
      background:#f97316;
      color:white;
      font-weight:bold;
      cursor:pointer;
    }

    button:hover{
      background:#ea580c;
    }

    .app{
      display:none;
    }

    .header{
      background:#111827;
      padding:18px;
      text-align:center;
      font-size:22px;
      font-weight:bold;
    }

    .container{
      max-width:700px;
      margin:auto;
      padding:20px;
    }

    .row{
      display:flex;
      gap:10px;
      margin-top:10px;
    }

    .history-box{
      background:#111827;
      padding:15px;
      border-radius:10px;
      margin-top:15px;
      display:none;
    }

    label{
      display:block;
      margin-top:15px;
    }
  </style>
</head>

<body>

<!-- LOGIN SCREEN -->
<div class="login-screen" id="loginScreen">

  <div class="card">

    <h2>SAR Text-to-Speech</h2>

    <input type="email" id="email" placeholder="Email">

    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <button onclick="register()">Register</button>

  </div>

</div>

<!-- MAIN APP -->
<div class="app" id="app">

  <div class="header">
    SAR Text-to-Speech Dashboard
  </div>

  <div class="container">

    <textarea id="text" placeholder="Write your text here..."></textarea>

    <label>Select Voice</label>

    <select id="voice"></select>

    <label>Speed</label>
    <input type="range" id="speed" min="0.5" max="2" value="1" step="0.1">

    <label>Pitch</label>
    <input type="range" id="pitch" min="0" max="2" value="1" step="0.1">

    <div class="row">
      <button onclick="speak()">Speak</button>
      <button onclick="stopSpeech()">Stop</button>
    </div>

    <div class="row">
      <button onclick="downloadSpeech()">Download</button>
      <button onclick="showHistory()">History</button>
    </div>

    <button onclick="logout()" style="margin-top:15px;background:red;">
      Logout
    </button>

    <div class="history-box" id="historyBox"></div>

  </div>

</div>

<script>

let voices = [];
let historyList = [];

/* ---------------- LOAD VOICES ---------------- */

function loadVoices() {

  voices = speechSynthesis.getVoices();

  const select = document.getElementById("voice");

  select.innerHTML = "";

  voices.forEach((voice, i) => {

    const option = document.createElement("option");

    option.value = i;

    option.textContent = voice.name + " (" + voice.lang + ")";

    select.appendChild(option);

  });
}

speechSynthesis.onvoiceschanged = loadVoices;

setTimeout(loadVoices, 1000);

/* ---------------- LOGIN ---------------- */

async function login() {

  const email = document.getElementById("email").value;

  const password = document.getElementById("password").value;

  try {

    const res = await fetch("/login", {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        email,
        password
      })
    });

    const data = await res.json();

    if(data.success){

      document.getElementById("loginScreen").style.display = "none";

      document.getElementById("app").style.display = "block";

    } else {

      alert(data.error || "Login failed");

    }

  } catch(err){

    alert("Server error");

  }
}

/* ---------------- REGISTER ---------------- */

async function register() {

  const email = document.getElementById("email").value;

  const password = document.getElementById("password").value;

  try {

    const res = await fetch("/register", {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        email,
        password
      })
    });

    const data = await res.json();

    if(data.success){

      alert("Registered successfully");

    } else {

      alert(data.error || "Register failed");

    }

  } catch(err){

    alert("Server error");

  }
}

/* ---------------- SPEAK ---------------- */

function speak() {

  const text = document.getElementById("text").value;

  const voiceIndex = document.getElementById("voice").value;

  const speed = parseFloat(document.getElementById("speed").value);

  const pitch = parseFloat(document.getElementById("pitch").value);

  const utter = new SpeechSynthesisUtterance(text);

  if(voices[voiceIndex]){
    utter.voice = voices[voiceIndex];
  }

  utter.rate = speed;

  utter.pitch = pitch;

  speechSynthesis.cancel();

  speechSynthesis.speak(utter);

  saveHistory(text);
}

/* ---------------- STOP ---------------- */

function stopSpeech() {

  speechSynthesis.cancel();

}

/* ---------------- DOWNLOAD ---------------- */

async function downloadSpeech() {

  const text = document.getElementById("text").value;

  try {

    const res = await fetch("/speak", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ text })
    });

    const data = await res.json();

    if (!data.text) {
      alert("Download failed");
      return;
    }

    const blob = new Blob([data.text], { type: "text/plain" });

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "speech.txt";
    a.click();

    URL.revokeObjectURL(url);

  } catch (err) {
    alert("Server error");
  }
}
/* ---------------- LOGOUT ---------------- */

function logout(){

  document.getElementById("app").style.display = "none";

  document.getElementById("loginScreen").style.display = "flex";

}

/* ---------------- HISTORY ---------------- */

function saveHistory(text){

  if(!text) return;

  historyList.push(text);

  if(historyList.length > 10){
    historyList.shift();
  }
}

function showHistory(){

  const box = document.getElementById("historyBox");

  if(box.style.display === "block"){

    box.style.display = "none";

    return;
  }

  box.style.display = "block";

  box.innerHTML = "<h3>History</h3>";

  historyList.forEach((item, index) => {

    box.innerHTML += `<p>${index + 1}. ${item}</p>`;

  });
}

</script>

</body>
</html>
