<!DOCTYPE html>
<html>
<head>
  <title>SAR Text to Speech</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;
    }

    textarea {
      width: 90%;
      height: 120px;
      margin-bottom: 10px;
    }

    select, button, input {
      padding: 10px;
      margin: 5px;
      width: 90%;
      max-width: 400px;
    }

    .box {
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>SAR Text-to-Speech</h1>

  <!-- LOGIN -->
  <div class="box">
    <h3>Login</h3>
    <input id="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />

    <button onclick="login()">Login</button>
    <button onclick="register()">Register</button>
  </div>

  <hr>

  <!-- TEXT AREA -->
  <div class="box">
    <textarea id="text" placeholder="Write text here..."></textarea>

    <br>

    <select id="voice"></select>

    <br>

    <button onclick="speak()">Speak</button>
    <button onclick="downloadSpeech()">Download MP3</button>
  </div>

  <script>

    let voices = [];

    function loadVoices() {
      voices = speechSynthesis.getVoices();

      const voiceSelect = document.getElementById("voice");
      voiceSelect.innerHTML = "";

      voices.forEach((voice, i) => {
        const option = document.createElement("option");
        option.value = i;
        option.textContent = voice.name + " (" + voice.lang + ")";
        voiceSelect.appendChild(option);
      });
    }

    speechSynthesis.onvoiceschanged = loadVoices;

    loadVoices();

    // ---------------- LOGIN ----------------
    async function login() {

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const res = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();
      alert(JSON.stringify(data));
    }

    // ---------------- REGISTER ----------------
    async function register() {

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const res = await fetch("/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();
      alert(JSON.stringify(data));
    }

    // ---------------- SPEAK ----------------
    function speak() {

      const text = document.getElementById("text").value;

      const voiceIndex = document.getElementById("voice").value;

      const utterance = new SpeechSynthesisUtterance(text);

      utterance.voice = voices[voiceIndex];

      speechSynthesis.speak(utterance);
    }

    // ---------------- DOWNLOAD ----------------
    async function downloadSpeech() {

      const text = document.getElementById("text").value;

      const res = await fetch("/speak", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });

      const data = await res.json();

      if (data.audio) {

        const a = document.createElement("a");
        a.href = data.audio;
        a.download = "speech.wav";
        a.click();

      } else {
        alert("Download failed");
      }
    }

  </script>

</body>
</html>
