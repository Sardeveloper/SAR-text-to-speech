<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SAR Text to Speech</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MJW8XLZ5R4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-MJW8XLZ5R4');
  </script>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#fff7f0;
    }

    .header{
      background:#ff6a00;
      color:white;
      padding:15px;
      text-align:center;
      font-size:24px;
      font-weight:bold;
    }

    .container{
      max-width:700px;
      margin:30px auto;
      background:white;
      padding:20px;
      border-radius:12px;
      box-shadow:0 4px 20px rgba(0,0,0,0.1);
    }

    input, textarea, select, button{
      width:100%;
      margin-top:10px;
      padding:12px;
      border-radius:8px;
      font-size:16px;
    }

    textarea{
      height:140px;
      border:2px solid #ff6a00;
    }

    input, select{
      border:2px solid #ff6a00;
    }

    button{
      border:none;
      background:#ff6a00;
      color:white;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#e85c00;
      transform:scale(1.01);
    }

    .hidden{
      display:none;
    }

    .footer{
      text-align:center;
      margin-top:20px;
      color:gray;
      font-size:12px;
    }
  </style>
</head>

<body>

<div class="header">
  🔊 SAR Text to Speech
</div>

<!-- LOGIN / REGISTER -->
<div class="container" id="authBox">

  <h2>Login</h2>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <button onclick="login()">Login</button>
  <button onclick="register()">Register</button>

</div>

<!-- MAIN APP -->
<div class="container hidden" id="appBox">

  <h2>AI Voice Generator</h2>

  <textarea id="text" placeholder="Enter text here..."></textarea>

  <select id="voice"></select>

  <button onclick="speak()">▶ Generate Speech</button>
  <button onclick="stopSpeech()">⏹ Stop</button>
  <button onclick="downloadSpeech()">⬇ Download</button>

</div>

<div class="footer">
  © 2026 SAR Text to Speech
</div>

<script>

  // ---------------- LOGIN ----------------
  async function login() {

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const res = await fetch("/login", {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({ email, password })
    });

    const data = await res.json();

    if(data.success){
      document.getElementById("authBox").classList.add("hidden");
      document.getElementById("appBox").classList.remove("hidden");
      loadVoices();
    } else {
      alert(data.error || "Login failed");
    }
  }

  // ---------------- REGISTER ----------------
  async function register() {

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const res = await fetch("/register", {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({ email, password })
    });

    const data = await res.json();

    if(data.success){
      alert("Registration successful!");
    } else {
      alert(data.error || "Register failed");
    }
  }

  // ---------------- LOAD VOICES ----------------
function loadVoices() {

  const voices = speechSynthesis.getVoices();

  const voiceSelect = document.getElementById("voice");

  voiceSelect.innerHTML = "";

  // Filter only English voices
  const filteredVoices = voices.filter(voice =>
    voice.lang.includes("en")
  );

  // Sort premium voices first
  filteredVoices.sort((a, b) => {

    const premium = ["Google", "Microsoft"];

    const aPremium = premium.some(p => a.name.includes(p));
    const bPremium = premium.some(p => b.name.includes(p));

    return bPremium - aPremium;
  });

  filteredVoices.forEach((voice, index) => {

    const option = document.createElement("option");

    option.value = voices.indexOf(voice);

    let label = voice.name;

    // Better labels
    if (voice.name.includes("Google")) {
      label += " ⭐";
    }

    if (voice.name.includes("Microsoft")) {
      label += " 🔥";
    }

    option.textContent = label + " - " + voice.lang;

    voiceSelect.appendChild(option);

  });

}

  // ---------------- SPEAK ----------------
function speak() {

  speechSynthesis.cancel();

  const text = document.getElementById("text").value;

  if (!text) {
    alert("Please enter text");
    return;
  }

  const voices = speechSynthesis.getVoices();

  const selectedVoice =
    document.getElementById("voice").value;

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.rate = 1;
  utterance.pitch = 1;

  if (voices[selectedVoice]) {
    utterance.voice = voices[selectedVoice];
  }

  speechSynthesis.speak(utterance);

}
  // ---------------- STOP ----------------
  function stopSpeech(){
    speechSynthesis.cancel();
  }

  // ---------------- DOWNLOAD ----------------
  function downloadSpeech(){

async function downloadSpeech() {

  const text = document.getElementById("text").value;

  if (!text) {
    alert("Please enter text first");
    return;
  }

  const response = await fetch("/speak", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ text })
  });

  const data = await response.json();

  if (data.audio) {

    const link = document.createElement("a");

    link.href = data.audio;

    link.download = "sar_speech.wav";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

  } else {

    alert("Speech generation failed");

  }

}
</script>

</body>
</html>
