<!DOCTYPE html>
<html>
<head>
  <title>SAR Text-to-Speech</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    /* LOGIN SCREEN */
    .login-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      width: 320px;
    }

    input, button, select, textarea {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      border: none;
    }

    button {
      background: #f97316;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #ea580c;
    }

    /* MAIN APP */
    .app {
      display: none;
      padding: 20px;
    }

    .header {
      background: #111827;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .container {
      max-width: 600px;
      margin: auto;
      margin-top: 30px;
    }

    textarea {
      height: 120px;
      resize: none;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row button {
      flex: 1;
    }
  </style>
</head>

<body>

<!-- LOGIN PAGE -->
<div class="login-screen" id="loginScreen">

  <div class="card">
    <h2 style="text-align:center;">Login</h2>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
    <button onclick="register()">Register</button>
  </div>

</div>

<!-- MAIN APP -->
<div class="app" id="app">

  <div class="header">
    SAR Text-to-Speech Dashboard
  </div>

  <div class="container">

    <textarea id="text" placeholder="Write something..."></textarea>

    <select id="voice"></select>

    <div class="row">
      <button onclick="speak()">Speak</button>
      <button onclick="downloadSpeech()">Download</button>
    </div>

    <button onclick="logout()" style="margin-top:15px; background:red;">
      Logout
    </button>

  </div>
</div>

<script>

let voices = [];

function loadVoices() {
  voices = speechSynthesis.getVoices();
  const v = document.getElementById("voice");

  v.innerHTML = "";

  voices.forEach((voice, i) => {
    let option = document.createElement("option");
    option.value = i;
    option.textContent = voice.name;
    v.appendChild(option);
  });
}

speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

// ---------------- LOGIN ----------------
async function login() {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch("/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  });

  const data = await res.json();

  if (data.success) {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("app").style.display = "block";
  } else {
    alert(data.error || "Login failed");
  }
}

// ---------------- REGISTER ----------------
async function register() {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch("/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  });

  const data = await res.json();

  alert(data.success ? "Registered!" : data.error);
}

// ---------------- SPEAK ----------------
function speak() {

  const text = document.getElementById("text").value;
  const voiceIndex = document.getElementById("voice").value;

  const utter = new SpeechSynthesisUtterance(text);
  utter.voice = voices[voiceIndex];

  speechSynthesis.speak(utter);
}

// ---------------- DOWNLOAD ----------------
async function downloadSpeech() {

  const text = document.getElementById("text").value;

  const res = await fetch("/speak", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text })
  });

  const data = await res.json();

  if (data.audio) {
    const a = document.createElement("a");
    a.href = data.audio;
    a.download = "speech.wav";
    a.click();
  } else {
    alert("Failed");
  }
}

// ---------------- LOGOUT ----------------
function logout() {
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("app").style.display = "none";
}

</script>

</body>
</html>
