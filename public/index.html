<!DOCTYPE html>
<html>
<head>
  <title>SAR Text-to-Speech</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    /* LOGIN SCREEN */
    .login-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      width: 320px;
    }

    input, button, select, textarea {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      border: none;
    }

    button {
      background: #f97316;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #ea580c;
    }

    /* MAIN APP */
    .app {
      display: none;
      padding: 20px;
    }

    .header {
      background: #111827;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .container {
      max-width: 600px;
      margin: auto;
      margin-top: 30px;
    }

    textarea {
      height: 120px;
      resize: none;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row button {
      flex: 1;
    }
  </style>
</head>

<body>

<!-- LOGIN PAGE -->
<div class="login-screen" id="loginScreen">

  <div class="card">
    <h2 style="text-align:center;">Login</h2>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
    <button onclick="register()">Register</button>
  </div>

</div>

<!-- MAIN APP -->
<div class="app" id="app">

  <div class="header">
    SAR Text-to-Speech Dashboard
  </div>

  <div class="container">

    <textarea id="text" placeholder="Write something..."></textarea>

    <select id="voice"></select>
<label>Speed</label>
<input type="range" id="speed" min="0.5" max="2" value="1" step="0.1">

<label>Pitch</label>
<input type="range" id="pitch" min="0" max="2" value="1" step="0.1">

<div class="row">
  <button onclick="speak()">Speak</button>
  <button onclick="stopSpeech()">Stop</button>
</div>

<div class="row">
  <button onclick="downloadSpeech()">Download</button>
  <button onclick="showHistory()">History</button>
</div>

<div id="historyBox" style="display:none; margin-top:10px;"></div>

    <div class="row">
      <button onclick="speak()">Speak</button>
      <button onclick="downloadSpeech()">Download</button>
    </div>

    <button onclick="logout()" style="margin-top:15px; background:red;">
      Logout
    </button>

  </div>
</div>

<script>


// Load voices safely
let voices = [];

function loadVoices() {
  voices = speechSynthesis.getVoices();

  const select = document.getElementById("voice");
  select.innerHTML = "";

  const groups = {
    "🇺🇸 English": [],
    "🇬🇧 English UK": [],
    "🇮🇳 Hindi": [],
    "🇵🇰 Urdu": [],
    "🌍 Other": []
  };

  voices.forEach((voice, i) => {

    const lang = voice.lang.toLowerCase();

    const item = {
      index: i,
      name: voice.name,
      lang: voice.lang
    };

    if (lang.includes("en-us")) {
      groups["🇺🇸 English"].push(item);
    }
    else if (lang.includes("en-gb")) {
      groups["🇬🇧 English UK"].push(item);
    }
    else if (lang.includes("hi")) {
      groups["🇮🇳 Hindi"].push(item);
    }
    else if (lang.includes("ur")) {
      groups["🇵🇰 Urdu"].push(item);
    }
    else {
      groups["🌍 Other"].push(item);
    }
  });

  for (let g in groups) {

    const optGroup = document.createElement("optgroup");
    optGroup.label = g;

    groups[g].forEach(v => {
      const option = document.createElement("option");
      option.value = v.index;
      option.textContent = `${v.name} (${v.lang})`;
      optGroup.appendChild(option);
    });

    select.appendChild(optGroup);
  }

function speak() {

  const text = document.getElementById("text").value;
  const index = document.getElementById("voice").value;

  const utter = new SpeechSynthesisUtterance(text);

  const allVoices = speechSynthesis.getVoices();

  if (allVoices[index]) {
    utter.voice = allVoices[index];
  }

  utter.rate = 1;
  utter.pitch = 1;

  speechSynthesis.cancel();
  speechSynthesis.speak(utter);

  saveHistory?.(text);
}
// Auto load (important fix)
setTimeout(loadVoices, 800);
// ---------------- LOGIN ----------------
async function login() {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch("/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  });

  const data = await res.json();

  if (data.success) {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("app").style.display = "block";
  } else {
    alert(data.error || "Login failed");
  }
}

// ---------------- REGISTER ----------------
async function register() {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch("/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  });

  const data = await res.json();

  alert(data.success ? "Registered!" : data.error);
}

// ---------------- SPEAK ----------------
function speak() {

  const text = document.getElementById("text").value;
  const voiceIndex = document.getElementById("voice").value;

  const speed = parseFloat(document.getElementById("speed").value);
  const pitch = parseFloat(document.getElementById("pitch").value);

  const utter = new SpeechSynthesisUtterance(text);

  utter.voice = voices[voiceIndex];
  utter.rate = speed;
  utter.pitch = pitch;

  speechSynthesis.speak(utter);

  saveHistory(text);
}
// ---------------- DOWNLOAD ----------------
async function downloadSpeech() {

  const text = document.getElementById("text").value;

  const res = await fetch("/speak", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text })
  });

  const data = await res.json();

  if (data.audio) {
    const a = document.createElement("a");
    a.href = data.audio;
    a.download = "speech.wav";
    a.click();
  } else {
    alert("Failed");
  }
}

// ---------------- LOGOUT ----------------
function logout() {
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("app").style.display = "none";
}
function stopSpeech() {
  speechSynthesis.cancel();
}

</script>

</body>
</html>
