  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 🔥 SEO -->
  <title>SAR Text to Speech - AI Voice Generator</title>

  <meta name="description" content="SAR Text to Speech is a modern AI voice generator. Convert text into natural speech and download MP3 instantly.">
  <meta name="keywords" content="text to speech, AI voice generator, speech AI, SAR TTS, convert text to audio">
  <meta name="author" content="SAR Developer">

  <!-- 🌍 Social Preview -->
  <meta property="og:title" content="SAR Text to Speech - AI Voice Generator">
  <meta property="og:description" content="Convert text into natural AI voice and download MP3 instantly.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sar-text-to-speech.onrender.com">

  <!-- 🎨 UI STYLE -->
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7f0;
    }

    .header {
      background: #ff6a00;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 10px;
      border: 2px solid #ff6a00;
      border-radius: 8px;
      font-size: 16px;
    }

    select, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    select {
      border: 2px solid #ff6a00;
    }

    button {
      background: #ff6a00;
      color: white;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    button:hover {
      background: #e85c00;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: gray;
    }
  </style>
</head>

<body>

  <div class="header">
    🔊 SAR Text to Speech AI
  </div>

  <div class="container">

    <textarea id="text" placeholder="Enter text here..."></textarea>

    <!-- 🎤 VOICE SELECTION -->
    <select id="voice">
      <option value="male">Male Voice</option>
      <option value="female">Female Voice</option>
      <option value="british">British Voice</option>
      <option value="indian">Indian Voice</option>
    </select>

    <!-- 🔘 BUTTONS -->
    <button onclick="speak()">▶ Generate Speech</button>
    <button onclick="stop()">⏹ Stop</button>
    <button onclick="download()">⬇ Download MP3</button>

    <audio id="audio" controls style="width:100%; margin-top:15px;"></audio>

  </div>

  <div class="footer">
    © 2026 SAR Text to Speech | AI Voice SaaS
  </div>

  <!-- ⚙️ SIMPLE JS (frontend demo) -->
  <script>
    function speak() {
      const text = document.getElementById("text").value;
      const voice = document.getElementById("voice").value;

      fetch("/speak", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, voice })
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById("audio").src = data.audio;
      });
    }

    function stop() {
      const audio = document.getElementById("audio");
      audio.pause();
      audio.currentTime = 0;
    }

    function download() {
      const audio = document.getElementById("audio").src;
      const a = document.createElement("a");
      a.href = audio;
      a.download = "speech.mp3";
      a.click();
    }
  </script>

</body>
</html>
