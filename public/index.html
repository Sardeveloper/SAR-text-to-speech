<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SAR Text to Speech</title>

  <!-- SEO -->
  <meta name="description" content="SAR Text to Speech AI - Convert text into natural voice and download MP3 instantly.">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MJW8XLZ5R4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-MJW8XLZ5R4');
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7f0;
    }

    .header {
      background: #ff6a00;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 10px;
      border: 2px solid #ff6a00;
      border-radius: 8px;
      font-size: 16px;
    }

    select, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    select {
      border: 2px solid #ff6a00;
    }

    button {
      background: #ff6a00;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #e85c00;
      transform: scale(1.02);
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: gray;
    }
  </style>
</head>

<body>

  <div class="header">
    🔊 SAR Text to Speech AI
  </div>

  <div class="container">

    <textarea id="text" placeholder="Enter text here..."></textarea>

    <select id="voice"></select>

    <button onclick="speak()">▶ Generate Speech</button>
    <button onclick="stop()">⏹ Stop</button>
    <button onclick="download()">⬇ Download MP3</button>

    <audio id="audio" controls style="width:100%; margin-top:15px;"></audio>

  </div>

  <div class="footer">
    © 2026 SAR Text to Speech
  </div>

  <script>
    // Load real system voices
    function loadVoices() {
      const voices = speechSynthesis.getVoices();
      const voiceSelect = document.getElementById("voice");

      voiceSelect.innerHTML = "";

      voices.forEach((voice, i) => {
        const option = document.createElement("option");
        option.value = i;
        option.textContent = voice.name + " (" + voice.lang + ")";
        voiceSelect.appendChild(option);
      });
    }

    speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    // Speak (frontend fallback TTS)
    function speak() {
      const text = document.getElementById("text").value;
      const voices = speechSynthesis.getVoices();
      const voiceIndex = document.getElementById("voice").value;

      const utterance = new SpeechSynthesisUtterance(text);

      if (voices[voiceIndex]) {
        utterance.voice = voices[voiceIndex];
      }

      speechSynthesis.speak(utterance);

      // Also try backend (if exists)
      fetch("/speak", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      })
      .then(res => res.json())
      .then(data => {
        if (data.audio) {
          document.getElementById("audio").src = data.audio;
        }
      })
      .catch(err => console.log("Backend TTS not active"));
    }

    function stop() {
      speechSynthesis.cancel();
    }

    function download() {
      const audio = document.getElementById("audio");
      if (!audio.src) return alert("No audio yet!");
      
      const a = document.createElement("a");
      a.href = audio.src;
      a.download = "speech.mp3";
      a.click();
    }
  </script>

</body>
</html>
